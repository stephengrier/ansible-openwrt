- name: Configure an openwrt router
  hosts: "all:&{{ target_env | default('production') }}"
  gather_facts: no
  remote_user: root

  roles:
    - community.openwrt.init

  tasks:

    - name: Gather OpenWrt facts
      community.openwrt.setup:

    - name: "Check if host is a docker container"
      stat:
        path: "/.dockerenv"
      register: host_is_container

    - name: Install packages
      action: community.openwrt.{{ openwrt_package_manager }}
      args:
        name: '{{ item }}'
        state: present
        update_cache: yes
      loop: '{{ packages.install }}'
      loop_control:
        label: Installing {{ item }}

    - name: Set cpufreq governor to ondemand in rc.local
      lineinfile:
        path: /etc/rc.local
        insertbefore: '^exit 0$'
        line: 'echo ondemand > /sys/devices/system/cpu/cpufreq/policy0/scaling_governor'

    - name: Check if mt7915e module file exists
      ansible.builtin.stat:
        path: /etc/modules.d/mt7915e
      register: mt7915e_file

    - name: Enable Wireless Ethernet Dispatch (WED)
      lineinfile:
        path: /etc/modules.d/mt7915e
        regex: '^mt7915e'
        line: 'mt7915e wed_enable=Y'
      when: mt7915e_file.stat.exists

    - name: Create /etc/config/network
      template:
        src: 'config/network'
        dest: '/etc/config/network'
      notify: Restart network

    - name: Create /etc/config/wireless
      template:
        src: 'config/wireless'
        dest: '/etc/config/wireless'
      notify: Reload wifi
      when: wireless is defined

    - name: Create /etc/config/firewall
      template:
        src: 'config/firewall'
        dest: '/etc/config/firewall'
      notify: Reload firewall

    - name: Create /etc/config/dhcp
      template:
        src: 'config/dhcp'
        dest: '/etc/config/dhcp'
      notify: Restart dhcp

  handlers:

    - name: Reload firewall
      community.openwrt.nohup:
        command: '/etc/init.d/firewall reload'
        delay: 1

    - name: Restart dhcp
      community.openwrt.nohup:
        command: '/etc/init.d/dnsmasq restart'
        delay: 1
