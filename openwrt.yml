- name: Configure a production openwrt router
  hosts:
    - production_routers
  gather_facts: no

  roles:
    - community.openwrt.init
    - common
    - firewall
    - wireless
    - dhcp
    - solax_to_mqtt

- name: Configure a test openwrt router
  hosts:
    - test_routers
  gather_facts: no

  roles:
    - community.openwrt.init
    - common
    - firewall
    - dhcp

- name: Configure an openwrt switch
  hosts: production_switches
  gather_facts: no

  roles:
    - community.openwrt.init
    - common
    - firewall
