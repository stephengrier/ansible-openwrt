- name: Configure an openwrt router
  hosts:
    - production_routers
    - test_routers
  gather_facts: no

  roles:
    - community.openwrt.init
    - common
    - firewall
    - wireless
    - dhcp

  tasks:

    - name: Include the solax_to_mqtt role if host is in the production_routers group
      ansible.builtin.include_role:
        name: solax_to_mqtt
      when: "'production_routers' in group_names"

- name: Configure an openwrt switch
  hosts: production_switches
  gather_facts: no

  roles:
    - community.openwrt.init
    - common
    - firewall
